<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIP Mandiri - Daftar Akun</title>
  <link rel="stylesheet" href="../shared/css/design-system.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="css/onboarding.css">
</head>
<body>
  <div class="container">
    <h1>SIP Mandiri</h1>

    <div id="error-msg" class="error-msg" style="display:none;"></div>

    <!-- Step 1: Daftar Akun -->
    <section id="step-1">
      <h2>Langkah 1: Daftar Akun</h2>
      <form id="form-daftar">
        <label for="full_name">Nama Lengkap</label>
        <input type="text" id="full_name" name="full_name" required placeholder="Nama lengkap Anda">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="email@sekolah.id">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Minimal 6 karakter">

        <button type="submit" id="btn-daftar">Daftar</button>
      </form>
    </section>

    <!-- Step Konfirmasi Email -->
    <section id="step-konfirmasi" style="display:none;">
      <h2>Cek Email Anda</h2>
      <p class="instruksi">Link konfirmasi dikirim ke <strong id="konfirmasi-email"></strong>.</p>
      <p class="instruksi" style="margin-top:.75rem;">Klik link di email untuk mengaktifkan akun, lalu masuk melalui halaman login.</p>
      <a href="../guru/index.html" class="btn-dashboard" style="margin-top:1.5rem;display:block;text-align:center;">Ke Halaman Login</a>
      <p class="instruksi" style="margin-top:1rem;font-size:.9em;">
        Email tidak masuk?
        <button type="button" id="btn-kirim-ulang" class="link-btn">Kirim ulang</button>
      </p>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../shared/js/supabase.js"></script>
  <script src="js/onboarding.js"></script>
</body>
</html>
