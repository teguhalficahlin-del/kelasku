<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIP Mandiri — Login Ortu</title>
  <link rel="stylesheet" href="css/ortu.css">
</head>
<body>
  <div class="container">
    <h1>SIP Mandiri</h1>
    <h2>Login Orang Tua</h2>

    <form id="form-login">
      <label for="inp-kode">Kode Kelas</label>
      <input type="text" id="inp-kode" placeholder="Contoh: A1B2C3D4" autocomplete="off">

      <label for="inp-nama-anak">Nama Lengkap Anak</label>
      <input type="text" id="inp-nama-anak" placeholder="Nama anak sesuai data guru" autocomplete="off">

      <label for="inp-nis-anak">NIS Anak</label>
      <input type="text" id="inp-nis-anak" placeholder="Nomor Induk Siswa anak" autocomplete="off">

      <button type="submit" id="btn-login">Masuk</button>
      <div id="login-error" class="error-msg" style="display:none;"></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/ortu.js"></script>
</body>
</html>
