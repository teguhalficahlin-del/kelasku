<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiClass — Dashboard Ortu</title>
  <link rel="stylesheet" href="../shared/css/design-system.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="css/ortu.css">
  <!-- PWA: dapat dipasang ke layar utama -->
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#0A0A0F">
  <link rel="icon" href="../icons/favicon-32.png" sizes="32x32" type="image/png">
  <!-- iOS tidak membaca ikon dari manifest; apple-touch-icon wajib dan harus opak -->
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MiClass">
</head>
<body class="dashboard">
  <header>
    <span class="header-brand">MiClass</span>
    <div class="header-right">
      <span id="ortu-name"></span>
      <button type="button" id="btn-logout">Keluar</button>
    </div>
  </header>

  <main>
    <div id="classroom-list"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="../shared/js/pwa.js"></script>
</body>
</html>
