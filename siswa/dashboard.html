<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiClass — Dashboard Siswa</title>
  <link rel="stylesheet" href="../shared/css/design-system.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="css/siswa.css">
  <!-- PWA: dapat dipasang ke layar utama -->
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#0A0A0F">
  <link rel="icon" href="../icons/favicon-32.png" sizes="32x32" type="image/png">
  <!-- iOS tidak membaca ikon dari manifest; apple-touch-icon wajib dan harus opak -->
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MiClass">
</head>
<body class="dashboard">
  <header>
    <span class="header-brand">MiClass</span>
    <div class="header-right">
      <span id="siswa-name"></span>
      <button type="button" id="btn-logout">Keluar</button>
    </div>
  </header>

  <main>
    <div id="classroom-list"></div>
    <div id="panel-profil" style="display:none"></div>
  </main>

  <nav class="bottom-nav" id="bottom-nav">
    <button class="bottom-nav-btn active" id="nav-beranda" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Beranda</span>
    </button>
    <button class="bottom-nav-btn" id="nav-profil" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Profil</span>
    </button>
  </nav>

  <script src="../shared/js/vendor/supabase-js-2.112.3.umd.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="../shared/js/pwa.js"></script>
</body>
</html>
