<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiClass — Dashboard Siswa</title>
  <link rel="stylesheet" href="../shared/css/design-system.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="css/siswa.css">
  <!-- PWA: dapat dipasang ke layar utama -->
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#0A0A0F">
  <link rel="icon" href="../icons/favicon-32.png" sizes="32x32" type="image/png">
  <!-- iOS tidak membaca ikon dari manifest; apple-touch-icon wajib dan harus opak -->
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MiClass">
</head>
<body class="dashboard">
  <header>
    <span class="header-brand">MiClass</span>
    <div class="header-right">
      <span id="siswa-name"></span>
      <button type="button" id="btn-logout">Keluar</button>
    </div>
  </header>

  <main>
    <div id="panel-jadwal"></div>
    <div id="panel-kehadiran" style="display:none"></div>
    <div id="panel-catatan"   style="display:none"></div>
    <div id="panel-penilaian" style="display:none"></div>
  </main>

  <nav class="bottom-nav" id="bottom-nav">
    <button class="bottom-nav-btn active" id="nav-jadwal" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Jadwal</span>
    </button>
    <button class="bottom-nav-btn" id="nav-kehadiran" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
      <span>Kehadiran</span>
    </button>
    <button class="bottom-nav-btn" id="nav-catatan" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span>Catatan</span>
    </button>
    <button class="bottom-nav-btn" id="nav-penilaian" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>Penilaian</span>
    </button>
  </nav>

  <script src="../shared/js/vendor/supabase-js-2.112.3.umd.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="../shared/js/pwa.js"></script>
</body>
</html>
