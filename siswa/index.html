<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIP Mandiri — Login Siswa</title>
  <link rel="stylesheet" href="../shared/css/design-system.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="css/siswa.css">
  <!-- PWA: dapat dipasang ke layar utama -->
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#0A0A0F">
  <link rel="icon" href="../icons/favicon-32.png" sizes="32x32" type="image/png">
  <!-- iOS tidak membaca ikon dari manifest; apple-touch-icon wajib dan harus opak -->
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SIP Mandiri">
</head>
<body>
  <div class="container">
    <h1>SIP Mandiri</h1>
    <h2>Login Siswa</h2>

    <form id="form-login">
      <label for="inp-kode">Kode Kelas</label>
      <input type="text" id="inp-kode" placeholder="Contoh: A1B2C3D4" autocomplete="off">

      <label for="inp-nama">Nama Lengkap</label>
      <input type="text" id="inp-nama" placeholder="Nama sesuai data guru" autocomplete="off">

      <label for="inp-nis">NIS</label>
      <input type="text" id="inp-nis" placeholder="Nomor Induk Siswa" autocomplete="off">

      <button type="submit" id="btn-login">Masuk</button>
      <div id="login-error" class="error-msg" style="display:none;"></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/siswa.js"></script>
  <script src="../shared/js/pwa.js"></script>
</body>
</html>
