<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIP Mandiri — Dashboard Guru</title>
  <link rel="stylesheet" href="../shared/css/design-system.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="css/guru.css">
</head>
<body class="dashboard">

  <header>
    <span class="header-brand">SIP Mandiri</span>
    <div class="header-right">
      <span id="guru-name"></span>
      <button id="btn-logout">Keluar</button>
    </div>
  </header>

  <main>
    <div id="help-strip" class="help-strip">💡 Panduan penggunaan dashboard</div>
    <div id="trial-banner" class="trial-banner" style="display:none;"></div>
    <div class="toolbar">
      <h2>Classroom Saya</h2>
      <button id="btn-buat-classroom">+ Buat Classroom</button>
    </div>

    <div id="classroom-list"></div>

    <div id="help-overlay" class="help-overlay" style="display:none">
      <div class="help-modal">
        <div class="help-modal-header">
          <span id="help-title"></span>
          <button id="help-close">×</button>
        </div>
        <p id="help-intro"></p>
        <div id="help-body"></div>
      </div>
    </div>
  </main>

  <!-- Modal buat classroom — multi-step -->
  <div id="modal-classroom" style="display:none;">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-box">

      <!-- Step indicator -->
      <div class="step-indicator">
        <span class="step-dot active" id="step-dot-1">1</span>
        <span class="step-line"></span>
        <span class="step-dot" id="step-dot-2">2</span>
      </div>

      <!-- Step 1: Info Classroom -->
      <div id="modal-step1">
        <h3>Buat Classroom Baru</h3>
        <div id="modal-error" class="error-msg" style="display:none;"></div>
        <form id="form-classroom">
          <label for="inp-name">Nama Kelas</label>
          <input type="text" id="inp-name" required placeholder="Contoh: X DPB">

          <label for="inp-subject">Mata Pelajaran</label>
          <input type="text" id="inp-subject" required placeholder="Contoh: Bahasa Inggris">

          <label for="inp-desc">Deskripsi <span class="opsional">(opsional)</span></label>
          <input type="text" id="inp-desc" placeholder="Keterangan singkat">

          <div class="modal-actions">
            <button type="button" id="btn-batal">Batal</button>
            <button type="submit" id="btn-lanjut">Lanjut →</button>
          </div>
        </form>
      </div>

      <!-- Step 2: Atur Jadwal -->
      <div id="modal-step2" style="display:none;">
        <h3>Atur Jadwal <span class="opsional">(opsional)</span></h3>
        <p class="hint" style="margin-bottom:.875rem;">Tambah jadwal mingguan. Jadwal diperlukan agar absensi bisa digunakan.</p>
        <div id="step2-error" class="error-msg" style="display:none;"></div>

        <div class="schedule-table-wrap">
          <table class="schedule-input-table">
            <thead>
              <tr>
                <th>Hari</th>
                <th>Jam Mulai</th>
                <th>Jam Selesai</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="schedule-rows"></tbody>
          </table>
        </div>

        <button type="button" id="btn-tambah-hari">+ Tambah Hari</button>

        <div class="modal-actions modal-actions-step2">
          <button type="button" id="btn-lewati">Lewati untuk sekarang</button>
          <button type="button" id="btn-simpan-jadwal">Simpan &amp; Buat Classroom</button>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../shared/js/supabase.js"></script>
  <script src="js/api.js"></script>
  <script src="js/guru.js"></script>
</body>
</html>
