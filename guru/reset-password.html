<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiClass — Password Baru</title>
  <link rel="stylesheet" href="../shared/css/design-system.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="css/guru.css">
  <meta name="theme-color" content="#0A0A0F">
  <link rel="icon" href="../icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <!-- Halaman ini tujuan tautan dari email; jangan diindeks mesin pencari. -->
  <meta name="robots" content="noindex">
</head>
<body>
  <div class="container">
    <h1>MiClass</h1>

    <section>
      <h2>Buat Password Baru</h2>

      <div id="state-memuat">
        <p class="link-daftar" style="text-align:left">Memeriksa link reset…</p>
      </div>

      <div id="state-form" style="display:none;">
        <div id="error-msg" class="error-msg" style="display:none;"></div>
        <div id="ok-msg" class="ok-msg" style="display:none;"></div>

        <form id="form-reset">
          <label for="password-baru">Password baru</label>
          <input type="password" id="password-baru" name="password-baru" required
                 minlength="8" autocomplete="new-password" placeholder="Minimal 8 karakter">

          <label for="password-ulang">Konfirmasi password baru</label>
          <input type="password" id="password-ulang" name="password-ulang" required
                 minlength="8" autocomplete="new-password" placeholder="Ketik ulang password baru">

          <button type="submit" id="btn-ganti">Ganti Password</button>
        </form>
      </div>

      <div id="state-gagal" style="display:none;">
        <div id="gagal-msg" class="error-msg"></div>
        <p class="link-daftar"><a href="index.html">Kembali ke halaman login</a></p>
      </div>
    </section>
  </div>

  <script src="../shared/js/vendor/supabase-js-2.112.3.umd.js"></script>
  <script src="../shared/js/supabase.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
