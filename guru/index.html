<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiClass — Login Guru</title>
  <link rel="stylesheet" href="../shared/css/design-system.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="css/guru.css">
  <!-- PWA: dapat dipasang ke layar utama -->
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#0A0A0F">
  <link rel="icon" href="../icons/favicon-32.png" sizes="32x32" type="image/png">
  <!-- iOS tidak membaca ikon dari manifest; apple-touch-icon wajib dan harus opak -->
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MiClass">
</head>
<body>
  <div class="container">
    <h1>MiClass</h1>

    <section>
      <h2>Masuk sebagai Guru</h2>

      <!-- Pesan yang dititipkan halaman lain sebelum mengalihkan ke sini,
           mis. setelah reset semester mencabut seluruh sesi guru. -->
      <div id="login-info" class="ok-msg" style="display:none;"></div>

      <div id="error-msg" class="error-msg" style="display:none;"></div>

      <form id="form-login">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="email@sekolah.id">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Password Anda">

        <button type="submit" id="btn-masuk">Masuk</button>
      </form>

      <p class="link-lupa"><a href="#" id="link-lupa">Lupa password?</a></p>

      <!-- Form pemulihan tampil menggantikan form login di tempat, bukan di
           halaman terpisah: guru yang salah ingat password tidak kehilangan
           konteks, dan tombol Batal mengembalikannya persis ke keadaan semula. -->
      <div id="reset-panel" style="display:none;">
        <div id="reset-ok" class="ok-msg" style="display:none;"></div>

        <form id="form-reset-minta">
          <label for="reset-email">Email terdaftar</label>
          <input type="email" id="reset-email" name="reset-email" required
                 autocomplete="email" placeholder="email@sekolah.id">

          <button type="submit" id="btn-kirim-reset">Kirim Link Reset</button>
          <button type="button" id="btn-batal-reset" class="btn-sekunder">Batal</button>
        </form>
      </div>

      <p class="link-daftar">Belum punya akun? <a href="../onboarding/index.html">Daftar di sini</a></p>
    </section>
  </div>

  <script src="../shared/js/vendor/supabase-js-2.112.3.umd.js"></script>
  <script src="../shared/js/config.js"></script>
  <script src="../shared/js/supabase.js"></script>
  <script src="js/guru.js"></script>
  <script src="../shared/js/pwa.js"></script>
</body>
</html>
